# screener/config/universe_rules.yaml
# ユニバース条件。仕様書 §2「ユニバース条件」。
# 数字を変えたらここだけを変える —— コードには閾値を書かない。

version: 2
updated: "2026-09-18"

size:
  # 時価総額50〜3,000億円。単位は JPY mn（= 百万円）で統一。
  # 下限50億は据え置き（先生の型③）。上限の履歴: 600億 → 1,000億 → 3,000億。
  # 2026-08-31 ユーザー戦略判断により 600億 → 1,000億。準小型のテーマ化銘柄まで
  # 対象に含めるため。
  # 2026-09-18 ユーザー戦略判断により 1,000億 → 3,000億。投資対象としての判断。
  # いずれも検証8銘柄を通すための変更ではない（仕様書§6の原則は維持——
  # 検証で調整するのはS1〜S8の重みであってユニバース条件ではない）。
  # 時価総額の出所は J-Quants V2 の MktCap のみ（株探等のスクレイピングはしない）。
  # 拡大の効果は P3 で時価総額帯 50-600 / 600-1,000 / 1,000-3,000億 に分けて測る
  # （docs/backtest_acceptance_criteria.md P3-4）。
  mktcap_min_mn: 5000
  mktcap_max_mn: 300000

liquidity:
  # スパイダープラス(4192)の教訓の機械化: 出来ても出られない銘柄を最初から外す。
  # 20日平均売買代金 3,000万円 = 30 JPY mn。
  adv20_min_mn: 30
  # ADV を計算するのに最低限必要な観測日数。これを下回る銘柄は
  # 「流動性不足」ではなく「判定不能」として別扱いにする（黙って落とさない）。
  min_observations: 15
  # 平均を取る営業日数。--price-days は休場日で取りこぼさないための遡行幅であって
  # 平均の窓ではない。名前どおり 20 日で平均する。
  adv_window_days: 20

exclude_sectors:
  # 33業種名（J-Quants Sector33CodeName / JPX 業種区分）。
  # 銀行・保険は DCF が成立せず（手順書v2 §2 型D）、REIT は事業会社ではない。
  by_name:
    - 銀行業
    - 保険業
    - 証券、商品先物取引業
  # J-Quants Sector33Code。名前表記ゆれの保険として併記する。
  by_code:
    - "7050"   # 銀行業
    - "7100"   # 証券、商品先物取引業
    - "7150"   # 保険業
  # 市場区分での除外（REIT・ETF・インフラファンドは上場銘柄一覧に混在する）。
  # J-Quants V2 の MktNm は「プライム」等の純粋な市場名になり、商品種別は
  # ProdCat へ分離された。jquants_universe.PRODUCT_CATEGORY が商品種別名を
  # 市場名に併記して戻すので、ここは商品種別名で書く。
  # 照合は大文字化して行う（apply_universe_rules）。実データには
  # 'TOKYO PRO MARKET'（V2 の MktNm / JPX の data_j.xls）と 'PRO Market'
  # （過去の取り込み分）が混在し、V1 時代の 'PRO Market' というエントリは
  # 大小が合わず一度も一致していなかった。'PRO MARKET' なら両方に当たる。
  by_market_name:
    - REIT
    - ETF
    - ETN
    - PRO MARKET
    - 出資証券

exclude_code_patterns:
  # REIT/ETF/インフラファンドは 1xxx / 2xxx / 8951-8999 帯に固まる。
  # コード帯だけで機械的に落とすのは乱暴なので、市場区分での除外を主とし、
  # ここは「市場区分が取れなかったとき」の保険に留める。
  - "^(13|14|15|16|17|18|19)\\d{2}$"   # ETF/ETN 帯
  - "^(89[5-9]\\d)$"                    # REIT 帯

exclude_share_classes:
  # 普通株以外の株式種別（優先株式等）。商品種別除外（by_market_name）と同じ扱い。
  # 2026-09-19 追加。25935 伊藤園（優先株式）がユニバースに入っていたため。
  # 優先株式は J-Quants V2 で ProdCat が内国株券扱いになり、MktNm も
  # 「プライム」のままなので、市場名での除外に掛からない（実データで7銘柄:
  # 25935 / 50765 / 75505 / 92015 / 92025 / 94345 / 94346）。
  #
  # 判定は銘柄コードで行う。証券コード5桁目は株式の種類で、0 が普通株。
  # normalise_code が末尾0だけを落とすので、**正規化後も5桁のコードは
  # 普通株ではない**。名前での判定は表記ゆれの保険として併記する。
  non_common_code: true
  by_name_pattern:
    - "優先株式"

notes:
  - "無料プランのJ-Quantsは12週遅延。ユニバース条件（規模・流動性）には許容する（仕様書 §2-3）。"
  - "SBIスクリーナーCSVは月1手動取り込みの補助のみ。自動巡回しない（既決定）。"
  - "universe_flag=0 の銘柄は削除せず exclude_reason を残す。除外理由が後から検証できること。"
