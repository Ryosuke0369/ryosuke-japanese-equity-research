# s12_dictionary.yaml — 定性文言diffシグナル(S12)の辞書
#
# **重みはすべて事前登録の初期値。3,810ペアでの評価結果を見てから
# 同一データで再調整することは禁止。** 変更が必要なら新規事前登録として記録する。
#
# 層の考え方:
#   Tier A 硬い事実   受注・値上げ・稼働・減損など、金額や数量に直結する事実
#   Tier B セグメント方向  セグメント別の増収/減収・増益/減益の向きの変化
#   Tier C 語彙diff   前年に無く当期に現れた（またはその逆の）評価語
#   Tier D フラグのみ 加点しない。後で層別するための印

caps:
  tier_a: 0.30
  tier_b: 0.15
  tier_c: 0.15
  composite: 0.30        # 合成後の clamp

# ---------------------------------------------------------------- Tier A
# 硬い事実。当期に現れ前年に無い（または逆）ときに効く。
tier_a:
  - key: order_backlog_up
    weight: 0.10
    patterns: ["受注(が|は)?(順調に)?(増加|伸長|拡大)", "受注残(高)?(が|は)?(増加|積み上が)"]
  - key: order_backlog_down
    weight: -0.10
    patterns: ["受注(が|は)?(減少|落ち込|低迷)", "受注残(高)?(が|は)?(減少|縮小)"]
  - key: price_raise
    weight: 0.08
    patterns: ["価格改定", "値上げ(を)?(実施|浸透)", "販売価格(の)?(引上げ|改定)"]
  - key: capacity_up
    weight: 0.08
    patterns: ["生産能力(の)?(増強|拡大)", "新(工場|ライン)(の)?(稼働|立ち上げ)",
               "稼働率(が|は)?(上昇|改善)"]
  - key: capacity_down
    weight: -0.08
    patterns: ["稼働率(が|は)?(低下|悪化)", "減産", "生産(を)?(縮小|停止)"]
  - key: cost_pressure
    weight: -0.06
    patterns: ["原材料価格(の)?高騰", "コスト(の)?(上昇|増加)が(利益|収益)を(圧迫|押し下げ)",
               "人件費(の)?(増加|上昇)が(先行|圧迫)"]
  - key: impairment
    weight: -0.10
    dedup: pl_adjustments      # pl_adjustments に登録済みなら 0
    patterns: ["減損損失(を)?計上", "特別損失(を)?計上"]
  - key: forecast_revision
    weight: 0.0                # 方向は本文から判定しない。dedup 対象
    dedup: tdnet_revision      # TDnet 業績予想修正が採用済みなら 0
    patterns: ["業績予想(を)?修正", "業績予想の修正", "通期(連結)?業績予想.{0,8}修正"]

# ---------------------------------------------------------------- Tier B
# セグメント別の方向。segment_changed=1 の期は評価しない（区分が違うため）。
tier_b:
  positive:
    weight: 0.05
    patterns: ["増収", "売上(高)?(は|が).{0,12}(増加|伸長|拡大)", "増益",
               "利益(は|が).{0,12}(増加|改善)"]
  negative:
    weight: -0.05
    patterns: ["減収", "売上(高)?(は|が).{0,12}(減少|落ち込)", "減益",
               "利益(は|が).{0,12}(減少|悪化)"]

# ---------------------------------------------------------------- Tier C
# 語彙diff。前年に無く当期に現れた語（appeared）と、その逆（disappeared）。
tier_c:
  positive:
    weight: 0.03
    words: ["好調", "伸長", "回復", "堅調", "過去最高", "拡大", "改善", "上振れ"]
  negative:
    weight: -0.03
    words: ["低迷", "苦戦", "落ち込", "厳しい", "悪化", "下振れ", "停滞", "減速"]

# ---------------------------------------------------------------- Tier D
# フラグのみ。**加点しない。** 後で層別するための印。
tier_d:
  - key: new_product_mention
    patterns: ["新製品", "新商品", "(の)?開発に成功", "上市", "新規発売", "発売(を)?(開始|予定)"]
  - key: forecast_revision_mentioned
    patterns: ["業績予想(を)?修正", "業績予想の修正", "通期(連結)?業績予想.{0,8}修正"]
  - key: segment_changed
    patterns: ["報告セグメントの変更", "セグメント区分(の)?変更", "報告セグメントを変更"]

# ---------------------------------------------------------------- 加点禁止
# ここに当たる文は Tier A/B/C の加点対象から外す。方針・目標・計画は
# 「これから何をするか」であって、起きた事実ではない。
no_credit:
  - "中期経営計画"
  - "中計"
  - "基本方針"
  - "目指して"
  - "目標(と)?(して|し)"
  # 「〜を目標に準備を進めております」型。事実ではなく予定なので加点しない
  # （2026-09-02 の fixture で取りこぼしを検出）
  - "目標に"
  - "準備を進め"
  - "進めております"
  - "取り組んでおります"
  - "推進してまいります"
  - "方針(の)?(もと|下)"
  - "MOU"
  - "基本合意"
  - "検討(を)?(開始|進め)"
  - "予定であります"

# 除外セクション。経済環境の一般論と、財政状態/CFの分析は見ない。
exclude_sections:
  - "財政状態(に関する|の)(説明|分析|概況)"
  - "キャッシュ・フロー"
  - "重要な変更はありません"
  - "会計方針"
