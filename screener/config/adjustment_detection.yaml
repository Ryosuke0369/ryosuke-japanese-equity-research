# screener/config/adjustment_detection.yaml
# 一過性収益の「検出」条件。docs/adapter_design.md A-3。
# ここが拾うのは候補であって判定ではない。確定は人が注記を読んで行う。
#
# 閾値は緩めに置いてある。厳しくすると見逃し、緩めるとキューが溢れる。
# 溢れる方がまだ安全（見逃した一過性収益は S1/S5 の誤発火として直接損失に
# つながるが、余計にキューへ積まれた期は人が1分で棄却できる）。

version: 1
updated: "2026-08-31"

detect:
  # 前年同四半期に対する売上倍率。3905 FY2027Q1 は 9.5倍だった。
  revenue_ratio_high: 2.0
  revenue_ratio_low: 0.5
  # 粗利率の前年同四半期からの変化(pt)。3905 は +63.3pt。
  gross_margin_shift_pt: 20.0
  # 営業損益の符号反転は無条件で候補にする（閾値なし。コード側で判定）
